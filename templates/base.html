<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}SQA Monitor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand" href="{% url 'inicio' %}">SQA Monitor</a>
      {% if user.is_authenticated %}
      <form method="post" action="{% url 'cuentas:logout' %}">{% csrf_token %}
        <span class="me-2">{{ user.correo }}</span>
        <button class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
      </form>
      {% endif %}
    </div>
  </nav>
  <main class="container">
    {% for m in messages %}<div class="alert alert-{{ m.tags }}">{{ m }}</div>{% endfor %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
